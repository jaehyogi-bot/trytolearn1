name: KIS Full Validation Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kis_full_validation_once.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kis-semiconductor-scan
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore encrypted KIS token cache
        uses: actions/cache@v4
        with:
          path: .runtime/kis_token_cache.enc
          key: kis-token-v1-${{ github.run_id }}
          restore-keys: |
            kis-token-v1-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile all Python modules
        run: python -m py_compile kis_collect.py kis_runner.py kis_token_store.py market_day_check.py market_discovery.py scan_guard.py morning_freshness.py fallback_collect.py compare_snapshots.py

      - name: Verify cached token reuse
        shell: bash
        run: |
          set -o pipefail
          python kis_runner.py market-day-check --mode manual | tee /tmp/kis_auth_check.log
          grep -q "KIS_AUTH=CACHE" /tmp/kis_auth_check.log

      - name: Full 63-stock manual KIS collection
        run: timeout 12m python kis_runner.py collect --mode manual

      - name: Market-wide discovery
        run: timeout 4m python kis_runner.py discovery --mode manual

      - name: Validate full manual coverage
        run: python scan_guard.py --mode manual --require full

      - name: Validate morning freshness logic
        run: python morning_freshness.py --max-age-min 15

      - name: Validate current close snapshot
        run: python scan_guard.py --mode close --require full

      - name: Exercise public-web fallback
        run: timeout 4m python fallback_collect.py --mode manual

      - name: Validate fallback output
        run: python scan_guard.py --mode manual --require fallback

      - name: Compare intraday and close snapshots
        continue-on-error: true
        run: python compare_snapshots.py
