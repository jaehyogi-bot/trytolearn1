name: Normalize KRX Close Once

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/normalize_close_once.yml"

permissions:
  contents: write

concurrency:
  group: kis-semiconductor-scan
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Restore encrypted KIS token cache
        uses: actions/cache@v4
        with:
          path: .runtime/kis_token_cache.enc
          key: kis-token-v1-${{ github.run_id }}
          restore-keys: |
            kis-token-v1-
      - run: pip install -r requirements.txt
      - name: Normalize current close to KRX regular session
        run: timeout 6m python kis_runner.py normalize-close
      - name: Validate normalized close
        run: python scan_guard.py --mode close --require full
      - name: Commit normalized close data
        shell: bash
        run: |
          git config user.name "kis-close-normalizer"
          git config user.email "kis-close-normalizer@users.noreply.github.com"
          git add data/
          git commit -m "Normalize 2026-09-28 KRX regular close"
          git pull --rebase origin main
          git push origin main
