name: KIS Morning Scans

on:
  workflow_dispatch:
  schedule:
    # UTC -> KST +9
    # 10:00 KST: data for the 10:25 anomaly scan
    - cron: "0 1 * * 1-5"
    # 10:30 KST: refresh for the 10:55 TOP10 scan
    - cron: "30 1 * * 1-5"

permissions:
  contents: write

concurrency:
  group: kis-semiconductor-scan
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Market-day preflight
        id: market
        shell: bash
        run: |
          set +e
          timeout 90s python market_day_check.py --mode manual
          RC=$?
          if [ "$RC" -eq 0 ]; then STATE="open"; elif [ "$RC" -eq 10 ]; then STATE="closed"; else STATE="unknown"; fi
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "KRX preflight state: $STATE"
          exit 0

      - name: Collect morning KIS snapshot
        id: primary
        if: steps.market.outputs.state != 'closed'
        continue-on-error: true
        run: timeout 12m python kis_collect.py --mode manual

      - name: Discover morning market anomalies
        if: steps.market.outputs.state != 'closed' && steps.primary.outcome == 'success'
        continue-on-error: true
        run: timeout 4m python market_discovery.py --mode manual

      - name: Check primary core
        id: core
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.market.outputs.state }}" = "closed" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          set +e
          python scan_guard.py --mode manual --require core
          RC=$?
          if [ "$RC" -eq 0 ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; fi
          exit 0

      - name: Public-web fallback
        if: always() && steps.market.outputs.state != 'closed' && steps.core.outputs.ok != 'true'
        continue-on-error: true
        run: timeout 4m python fallback_collect.py --mode manual

      - name: Commit morning data
        if: always()
        shell: bash
        run: |
          if git diff --quiet -- data/ 2>/dev/null && [ -z "$(git status --porcelain data/ 2>/dev/null)" ]; then exit 0; fi
          git config user.name "kis-morning-bot"
          git config user.email "kis-morning-bot@users.noreply.github.com"
          git add data/
          git commit -m "KIS morning snapshot $(TZ=Asia/Seoul date +%Y-%m-%dT%H:%M)"
          git pull --rebase origin main
          git push

      - name: Final gate
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.market.outputs.state }}" = "closed" ]; then exit 0; fi
          python scan_guard.py --mode manual --require core && exit 0
          python scan_guard.py --mode manual --require fallback
