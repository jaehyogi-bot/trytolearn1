name: KIS Semiconductor Scan

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kis_scan.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: Snapshot mode
        required: true
        default: manual
        type: choice
        options:
          - manual
          - "1540"
          - close
  schedule:
    # GitHub Actions cron is UTC. Korea = UTC+9.
    # 15:42 / 15:52 KST: primary + retry for the intraday snapshot.
    - cron: "42,52 6 * * 1-5"
    # 16:05 / 16:15 / 16:25 / 16:35 KST: close snapshot + retries.
    - cron: "5,15,25,35 7 * * 1-5"
    # 17:05 KST: final late backstop if GitHub skipped/delayed earlier schedules.
    - cron: "5 8 * * 1-5"

permissions:
  contents: write

concurrency:
  group: kis-semiconductor-scan
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
      KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Restore encrypted KIS token cache
        uses: actions/cache@v4
        with:
          path: .runtime/kis_token_cache.enc
          key: kis-token-v1-${{ github.run_id }}
          restore-keys: |
            kis-token-v1-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Choose scan mode
        id: mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            MODE="${{ inputs.mode }}"
          elif [ "${{ github.event.schedule }}" = "42,52 6 * * 1-5" ]; then
            MODE="1540"
          else
            MODE="close"
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "KIS scan mode: $MODE"

      - name: Check whether KRX has today's market data
        id: market
        shell: bash
        run: |
          set +e
          timeout 90s python kis_runner.py market-day-check --mode "${{ steps.mode.outputs.mode }}"
          RC=$?
          if [ "$RC" -eq 0 ]; then
            STATE="open"
          elif [ "$RC" -eq 10 ]; then
            STATE="closed"
          else
            STATE="unknown"
          fi
          echo "state=$STATE" >> "$GITHUB_OUTPUT"
          echo "KRX preflight state: $STATE"
          exit 0

      - name: Decide whether this snapshot needs a run
        id: freshness
        shell: bash
        run: |
          if [ "${{ steps.market.outputs.state }}" = "closed" ]; then
            echo "needs_run=false" >> "$GITHUB_OUTPUT"
            echo "Freshness: market closed; no snapshot required."
            exit 0
          fi
          set +e
          python scan_guard.py --mode "${{ steps.mode.outputs.mode }}" --require full
          RC=$?
          if [ "$RC" -eq 0 ]; then
            echo "needs_run=false" >> "$GITHUB_OUTPUT"
            echo "Freshness: today's full KIS snapshot already exists; skip duplicate run."
          else
            echo "needs_run=true" >> "$GITHUB_OUTPUT"
            echo "Freshness: missing/stale/incomplete; run collector."
          fi
          exit 0

      - name: Collect registered semiconductor universe
        id: primary
        if: steps.freshness.outputs.needs_run == 'true'
        continue-on-error: true
        run: timeout 12m python kis_runner.py collect --mode "${{ steps.mode.outputs.mode }}"

      - name: Discover market-wide anomaly candidates
        if: steps.freshness.outputs.needs_run == 'true' && steps.primary.outcome == 'success'
        continue-on-error: true
        run: timeout 4m python kis_runner.py discovery --mode "${{ steps.mode.outputs.mode }}"

      - name: Compare 15:40 with close
        if: steps.freshness.outputs.needs_run == 'true' && steps.mode.outputs.mode == 'close' && steps.primary.outcome == 'success'
        continue-on-error: true
        run: python compare_snapshots.py

      - name: Check primary core freshness
        id: postprimary
        if: always()
        shell: bash
        run: |
          if [ "${{ steps.market.outputs.state }}" = "closed" ]; then
            echo "core_ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          python scan_guard.py --mode "${{ steps.mode.outputs.mode }}" --require core
          RC=$?
          if [ "$RC" -eq 0 ]; then
            echo "core_ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "core_ok=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Public-web fallback for core fields
        id: fallback
        if: always() && steps.market.outputs.state != 'closed' && steps.postprimary.outputs.core_ok != 'true'
        continue-on-error: true
        run: timeout 4m python fallback_collect.py --mode "${{ steps.mode.outputs.mode }}"

      - name: Commit collected data and health files
        if: always()
        shell: bash
        run: |
          if git diff --quiet -- data/ 2>/dev/null && [ -z "$(git status --porcelain data/ 2>/dev/null)" ]; then
            echo "No new market data to commit."
            exit 0
          fi
          git config user.name "kis-scan-bot"
          git config user.email "kis-scan-bot@users.noreply.github.com"
          git add data/
          git commit -m "KIS ${{ steps.mode.outputs.mode }} snapshot $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin main

      - name: Final health gate
        if: always()
        shell: bash
        run: |
          MODE="${{ steps.mode.outputs.mode }}"
          MARKET="${{ steps.market.outputs.state }}"
          echo "## KIS scan health" >> "$GITHUB_STEP_SUMMARY"
          echo "- mode: $MODE" >> "$GITHUB_STEP_SUMMARY"
          echo "- market preflight: $MARKET" >> "$GITHUB_STEP_SUMMARY"
          if [ "$MARKET" = "closed" ]; then
            echo "- result: market closed; no snapshot expected" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if python scan_guard.py --mode "$MODE" --require full; then
            echo "- result: HEALTHY (fresh full KIS snapshot)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if python scan_guard.py --mode "$MODE" --require core; then
            echo "- result: DEGRADED (fresh KIS core data, some auxiliary fields missing)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if python scan_guard.py --mode "$MODE" --require fallback; then
            echo "- result: FALLBACK (KIS unusable, fresh public-web core data saved)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "- result: FAILURE (neither fresh KIS core nor complete fallback data)" >> "$GITHUB_STEP_SUMMARY"
          exit 1
